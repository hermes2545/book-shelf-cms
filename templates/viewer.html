<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ตัวอ่านหนังสือ PDF แบบพลิกหน้า">
  <title>Flip Viewer · Book Shelf</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/viewer.css">
</head>
<body>
  <main id="reader" class="reader-shell">
    <p id="status" class="reader-status" role="status" aria-live="polite">กำลังโหลดตัวอ่าน…</p>
    <div id="stage" class="flip-stage">
      <div id="book-viewport" class="book-viewport">
        <div id="book" aria-label="หน้าหนังสือแบบพลิกหน้า"></div>
      </div>
    </div>
    <nav class="page-controls" aria-label="เครื่องมือเปลี่ยนหน้า">
      <button id="back-shelf" class="icon-button" type="button" aria-label="กลับชั้นหนังสือ" title="กลับชั้นหนังสือ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 8v8m4-8v8m4-8v8M3 19h18"/></svg>
      </button>
      <button id="previous" class="icon-button" type="button" aria-label="หน้าก่อนหน้า" title="หน้าก่อนหน้า" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
      </button>
      <label class="visually-hidden" for="page-number">เลขหน้า</label>
      <input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="เลขหน้า">
      <span id="total" aria-live="polite">/ –</span>
      <button id="go" class="icon-button" type="button" aria-label="ไปยังหน้าที่ระบุ" title="ไปยังหน้า" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      </button>
      <button id="next" class="icon-button" type="button" aria-label="หน้าถัดไป" title="หน้าถัดไป" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>
      </button>
      <button id="fullscreen" class="icon-button" type="button" aria-label="แสดงเต็มจอ" title="เต็มจอ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
      </button>
      <button id="interaction-mode" class="icon-button interaction-mode" type="button" aria-label="ซูมเอกสาร" title="แตะเพื่อซูม หรือถ่างสองนิ้ว">
        <svg class="zoom-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.5v6m-3-3h6"/></svg>
        <svg class="pan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7.5a1.5 1.5 0 0 1 3 0V11 6.5a1.5 1.5 0 0 1 3 0V11 8a1.5 1.5 0 0 1 3 0v3.5-1a1.5 1.5 0 0 1 3 0V15c0 4-2.5 7-7 7h-1c-2.8 0-4.5-1.5-6-3.5L3.5 15a1.6 1.6 0 0 1 2.4-2.1L8 15z"/></svg>
      </button>
      <a id="original-pdf" class="icon-button" href="./" target="_blank" rel="noopener" aria-label="เปิด PDF ต้นฉบับ" title="เปิด PDF ต้นฉบับ" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l4 4v16H6zM14 2v5h5M9 12h6m-6 4h6"/></svg>
      </a>
    </nav>
    <audio id="page-turn-sound" src="assets/sounds/old-book-page.mp3" preload="auto"></audio>
    <noscript>กรุณาเปิด JavaScript เพื่อใช้เอฟเฟกต์พลิกหน้า หรือเปิด PDF ต้นฉบับจากแถบเครื่องมือด้านล่าง</noscript>
  </main>

  <script src="assets/vendor/page-flip.browser.js" defer></script>
  <script src="assets/viewer.js" type="module"></script>
</body>
</html>
