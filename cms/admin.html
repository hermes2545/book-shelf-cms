<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Shelf CMS</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#16221d;--muted:#69726d;--paper:#f3f0e9;--panel:#fff;--green:#24493c;--rust:#b75739;--line:#d8d1c6;--danger:#9b3434}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,"Noto Sans Thai",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;display:flex;align-items:center;gap:16px;padding:0 max(3vw,18px);background:#19352c;color:#fff}.logo{font:700 20px Georgia,serif;margin-right:auto}.logo small{font:400 10px/1 system-ui;display:block;letter-spacing:.12em;color:#b9cbc4}.top button{border:1px solid #ffffff44;background:transparent;color:#fff;border-radius:6px;padding:8px 12px}.layout{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 68px)}aside{padding:26px 20px;border-right:1px solid var(--line);background:#ece7de}.aside-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.aside-head h1{font-size:15px;margin:0}.new{border:0;background:var(--green);color:white;border-radius:5px;padding:8px 11px;font-weight:600}.search{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:14px}.book-list{display:grid;gap:7px}.book-row{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:10px;text-align:left;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px}.book-row:hover,.book-row.active{background:#fff;border-color:var(--line)}.thumb{width:34px;height:48px;background:#c8b79f;border-radius:2px;object-fit:cover}.book-row strong,.book-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-row small{color:var(--muted);font-size:10px;margin-top:2px}.status{width:7px;height:7px;border-radius:50%;background:#aaa}.status.live{background:#2e8a5d}.editor{padding:34px max(4vw,28px) 70px}.editor-head{display:flex;gap:20px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:27px}.editor-head>div{margin-right:auto}.editor-head h2{margin:0 0 4px;font:30px/1.2 Georgia,"Noto Sans Thai",serif}.editor-head p{margin:0;color:var(--muted)}.primary,.secondary,.danger{border-radius:6px;padding:10px 15px;font-weight:650}.primary{background:var(--green);border:1px solid var(--green);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{border:1px solid #d6b5b5;color:var(--danger);background:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:20px 25px;max-width:1000px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#56605b}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:11px 12px;color:var(--ink)}.field textarea{min-height:105px;resize:vertical}.upload{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:13px}.cover-preview{width:92px;aspect-ratio:2/3;object-fit:cover;background:#e6dfd4;border-radius:3px}.file-copy strong,.file-copy small{display:block}.file-copy small{color:var(--muted);overflow-wrap:anywhere;margin:5px 0 9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.switch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px}.switch input{width:18px;height:18px}.order{display:flex;gap:6px}.order button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:6px}.login{position:fixed;inset:0;display:grid;place-items:center;background:#17342d;z-index:5}.login[hidden]{display:none}.login-card{width:min(390px,90vw);padding:34px;background:#f7f4ed;border-radius:12px;box-shadow:0 30px 80px #0006}.login-card h1{font:35px Georgia,serif;margin:0}.login-card p{color:var(--muted);margin:7px 0 24px}.login-card input{width:100%;padding:12px;margin:0 0 12px;border:1px solid var(--line);border-radius:6px}.login-card button{width:100%}.toast{position:fixed;right:18px;bottom:18px;max-width:430px;padding:13px 17px;border-radius:7px;background:#1e3c32;color:#fff;box-shadow:0 10px 35px #0003;z-index:10}.toast.error{background:#8f3636}.toast[hidden]{display:none}.placeholder{max-width:550px;margin:12vh auto;text-align:center;color:var(--muted)}.placeholder b{display:block;font:42px Georgia,serif;color:var(--ink);margin-bottom:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.book-list{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.editor{padding:25px 18px}.editor-head{flex-wrap:wrap}.top .publish-label{display:none}}
</style></head><body>
<header class="top"><div class="logo">Book Shelf CMS<small>LOCAL ADMIN</small></div><button id="build">สร้าง Preview</button><button id="publish"><span class="publish-label">Publish to </span>GitHub</button><button id="logout">ออกจากระบบ</button></header>
<div class="layout"><aside><div class="aside-head"><h1>รายการหนังสือ <span id="total"></span></h1><button class="new" id="new">+ เพิ่ม</button></div><input class="search" id="filter" placeholder="ค้นหาใน CMS"><div id="list" class="book-list"></div></aside><main class="editor" id="editor"><div class="placeholder"><b>Book Shelf</b>เลือกหนังสือด้านซ้าย หรือเพิ่มรายการใหม่</div></main></div>
<div id="login" class="login"><form id="setup-form" class="login-card" hidden><h1>ตั้งค่า CMS</h1><p>สร้าง username และ password ครั้งแรก รหัสผ่านจะถูกเก็บเป็น salted hash บนเครื่องนี้เท่านั้น</p><input name="username" autocomplete="username" placeholder="Username" required maxlength="80"><input name="password" type="password" autocomplete="new-password" placeholder="Password อย่างน้อย 10 ตัวอักษร" required minlength="10"><input name="confirmation" type="password" autocomplete="new-password" placeholder="ยืนยัน Password" required minlength="10"><button class="primary">บันทึกการตั้งค่า</button></form><form id="login-form" class="login-card"><h1>Book Shelf</h1><p>เข้าสู่ระบบ CMS ที่ทำงานเฉพาะเครื่องนี้</p><input name="username" autocomplete="username" placeholder="Username" required><input name="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="primary">เข้าสู่ระบบ</button></form></div><div id="toast" class="toast" hidden></div>
<script>
'use strict';
let books=[], selected=null, csrf='';
const $=s=>document.querySelector(s), editor=$('#editor');
function toast(message,error=false){const n=$('#toast');n.textContent=message;n.className='toast'+(error?' error':'');n.hidden=false;clearTimeout(n.timer);n.timer=setTimeout(()=>n.hidden=true,4200)}
async function api(path,options={}){options.headers={...(options.headers||{}),...(csrf?{'X-CSRF-Token':csrf}:{})};const response=await fetch(path,options);const data=await response.json().catch(()=>({error:'Invalid response'}));if(!response.ok)throw new Error(data.error||'Request failed');return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(value){return value.normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||`book-${Date.now()}`}
function blank(){return{id:'',title:'',author:'',category:'ทั่วไป',published_at:new Date().toISOString().slice(0,10),description:'',pdf:'',cover:'',published:false,sort_order:books.length+1}}
function renderList(){const q=$('#filter').value.toLocaleLowerCase('th');const shown=books.filter(b=>`${b.title} ${b.author} ${b.category}`.toLocaleLowerCase('th').includes(q));$('#total').textContent=`(${books.length})`;$('#list').innerHTML=shown.map(b=>`<button class="book-row ${b.id===selected?'active':''}" data-id="${esc(b.id)}">${b.cover?`<img class="thumb" src="/preview/${esc(b.cover)}" alt="">`:'<span class="thumb"></span>'}<span><strong>${esc(b.title)}</strong><small>${esc(b.author||'ยังไม่ระบุผู้เขียน')}</small></span><i class="status ${b.published?'live':''}"></i></button>`).join('');document.querySelectorAll('.book-row').forEach(n=>n.onclick=()=>edit(n.dataset.id))}
function edit(id){selected=id;renderList();renderForm(books.find(b=>b.id===id))}
function renderForm(book){if(!book)return;editor.innerHTML=`<div class="editor-head"><div><h2>${book.id?'แก้ไขหนังสือ':'เพิ่มหนังสือ'}</h2><p>${book.id?`ID: ${esc(book.id)}`:'กรอกข้อมูลและอัปโหลดไฟล์ PDF'}</p></div><div class="order"><button id="up" title="เลื่อนขึ้น">↑</button><button id="down" title="เลื่อนลง">↓</button></div><button class="danger" id="remove">ลบรายการ</button><button class="primary" id="save">บันทึก</button></div><form class="form" id="book-form"><div class="field full"><label>ชื่อหนังสือ *</label><input name="title" value="${esc(book.title)}" required maxlength="200"></div><div class="field"><label>ผู้เขียน *</label><input name="author" value="${esc(book.author)}" required maxlength="160"></div><div class="field"><label>หมวดหมู่ *</label><input name="category" value="${esc(book.category)}" required maxlength="100"></div><div class="field"><label>วันที่เผยแพร่ *</label><input name="published_at" type="date" value="${esc(book.published_at)}" required></div><label class="switch"><input name="published" type="checkbox" ${book.published?'checked':''}> แสดงบนเว็บไซต์</label><div class="field full"><label>คำอธิบาย</label><textarea name="description" maxlength="2000">${esc(book.description)}</textarea></div><div class="field full"><label>ไฟล์ PDF *</label><div class="upload"><span class="cover-preview"></span><div class="file-copy"><strong>PDF สูงสุด 50 MB</strong><small id="pdf-path">${esc(book.pdf||'ยังไม่ได้อัปโหลด')}</small><input id="pdf-file" type="file" accept="application/pdf"></div></div></div><div class="field full"><label>รูปปก</label><div class="upload">${book.cover?`<img class="cover-preview" src="/preview/${esc(book.cover)}" alt="ตัวอย่างปก">`:'<span class="cover-preview"></span>'}<div class="file-copy"><strong>PNG, JPG, WebP หรือ GIF สูงสุด 8 MB</strong><small id="cover-path">${esc(book.cover||'ไม่ใส่ก็ได้ ระบบจะสร้างปกข้อความ')}</small><input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div></div></div></form>`;
let draft={...book};
async function upload(input,kind){if(!input.files[0])return;const file=input.files[0];toast(`กำลังอัปโหลด ${file.name}`);const result=await api(`/api/upload?kind=${kind}&filename=${encodeURIComponent(file.name)}`,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});draft[kind==='pdf'?'pdf':'cover']=result.path;toast('อัปโหลดแล้ว');renderForm(draft)}
$('#pdf-file').onchange=e=>upload(e.target,'pdf').catch(e=>toast(e.message,true));$('#cover-file').onchange=e=>upload(e.target,'cover').catch(e=>toast(e.message,true));
$('#save').onclick=async()=>{const form=$('#book-form');if(!form.reportValidity())return;const d=new FormData(form);draft={...draft,title:d.get('title').trim(),author:d.get('author').trim(),category:d.get('category').trim(),published_at:d.get('published_at'),description:d.get('description').trim(),published:d.get('published')==='on'};if(!draft.pdf)return toast('กรุณาอัปโหลด PDF',true);if(!draft.id)draft.id=slug(draft.title);const duplicate=books.find(b=>b.id===draft.id&&b.id!==book.id);if(duplicate)draft.id=`${draft.id}-${Date.now().toString().slice(-5)}`;if(book.id){books=books.map(b=>b.id===book.id?draft:b)}else books.push(draft);try{await saveAll();selected=draft.id;renderList();renderForm(draft);toast('บันทึกแล้ว')}catch(e){toast(e.message,true)}};
$('#remove').onclick=async()=>{if(!book.id){editor.innerHTML='';return}if(!confirm(`ลบรายการ “${book.title}” ออกจาก catalog?\nไฟล์ PDF และปกจะยังคงอยู่เพื่อป้องกันการลบโดยไม่ตั้งใจ`))return;books=books.filter(b=>b.id!==book.id);await saveAll();selected=null;renderList();editor.innerHTML='<div class="placeholder"><b>ลบรายการแล้ว</b>ไฟล์ต้นฉบับยังไม่ได้ถูกลบ</div>';toast('ลบจาก catalog แล้ว')};
$('#up').onclick=()=>move(book.id,-1);$('#down').onclick=()=>move(book.id,1)}
async function saveAll(){books=books.map((b,i)=>({...b,sort_order:books.length-i}));await api('/api/books',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(books)})}
async function move(id,delta){const index=books.findIndex(b=>b.id===id),other=index+delta;if(index<0||other<0||other>=books.length)return;[books[index],books[other]]=[books[other],books[index]];await saveAll();renderList();toast('เปลี่ยนลำดับแล้ว')}
async function load(){const session=await api('/api/session');if(session.setup_required){$('#setup-form').hidden=false;$('#login-form').hidden=true;return}if(!session.authenticated)return;csrf=session.csrf;$('#login').hidden=true;books=await api('/api/books');books.sort((a,b)=>b.sort_order-a.sort_order);renderList()}
$('#setup-form').onsubmit=async event=>{event.preventDefault();const d=new FormData(event.target);if(d.get('password')!==d.get('confirmation'))return toast('Password ทั้งสองช่องไม่ตรงกัน',true);try{await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:d.get('username'),password:d.get('password'),confirmation:d.get('confirmation')})});event.target.reset();event.target.hidden=true;$('#login-form').hidden=false;toast('ตั้งค่าเรียบร้อย กรุณาเข้าสู่ระบบ')}catch(e){toast(e.message,true)}};
$('#login-form').onsubmit=async event=>{event.preventDefault();const d=new FormData(event.target);try{const result=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:d.get('username'),password:d.get('password')})});csrf=result.csrf;$('#login').hidden=true;books=await api('/api/books');books.sort((a,b)=>b.sort_order-a.sort_order);renderList()}catch(e){toast(e.message,true)}};
$('#new').onclick=()=>{selected=null;renderList();renderForm(blank())};$('#filter').oninput=renderList;$('#build').onclick=()=>api('/api/build',{method:'POST'}).then(r=>toast(r.message)).catch(e=>toast(e.message,true));$('#publish').onclick=()=>{if(confirm('บันทึก commit และเผยแพร่รายการที่เปลี่ยนไปยัง GitHub Pages?'))api('/api/publish',{method:'POST'}).then(r=>toast(r.message)).catch(e=>toast(e.message,true))};$('#logout').onclick=()=>api('/api/logout',{method:'POST'}).then(()=>location.reload());load().catch(e=>toast(e.message,true));
</script></body></html>
